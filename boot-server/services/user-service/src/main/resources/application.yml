server:
  port: 8080

spring:
  application:
    name: boot-server

  mvc:
    servlet:
      # 所有 Spring MVC 接口共享的外部前缀。Controller 只声明资源路径（如 /users），
      # 将来改为 /api/v1 时仅修改此处；H2 Console 不是 MVC Controller，不受该前缀影响。
      path: /api

  datasource:
    driver-class-name: org.h2.Driver
    # H2 文件模式：数据固定落盘在 boot-server/data/（聚合根下，随工程走、可提交记录）
    # 说明：工作目录是服务模块 services/user-service（mvn 与 IDEA 运行均默认如此），
    #       相对路径 ../../data 即指向聚合根 boot-server/data/
    # MODE=MySQL：让 H2 尽量兼容 MySQL 语法，与文档中的 MySQL 心智保持一致
    # AUTO_SERVER=TRUE：允许 IDEA Database 面板等工具并发连接查看数据
    # 后期切 MySQL：pom 引入 mysql-connector-j，url 换 jdbc:mysql://localhost:3306/bootapp（MODE=MySQL 已对齐方言，改动最小）
    url: jdbc:h2:file:../../data/bootapp;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password: ""

  sql:
    init:
      # 每次启动执行 schema.sql 建表 + 初始化数据（脚本用幂等写法，可重复执行）
      mode: always
      schema-locations: classpath:db/schema.sql

  h2:
    console:
      # 浏览器控制台：http://localhost:8080/h2-console
      # 默认关闭，避免开发工具成为公开入口；本地学习时显式设置 H2_CONSOLE_ENABLED=true。
      # 打开后 JDBC URL 填上面 datasource.url 那一行，用户名 sa、密码留空。
      enabled: ${H2_CONSOLE_ENABLED:false}

  data:
    redis:
      host: ${BOOT_REDIS_HOST:localhost}
      port: ${BOOT_REDIS_PORT:6379}
      connect-timeout: ${BOOT_REDIS_CONNECT_TIMEOUT:PT1S}
      timeout: ${BOOT_REDIS_TIMEOUT:PT1S}

# ${JWT_SECRET_BASE64:} 表示优先读取环境变量，冒号后为空默认值；未配置时由 @NotBlank 拒绝启动。
# 密钥不写入仓库；Base64 解码后必须至少有 32 字节才能用于 HS256。启动前：export JWT_SECRET_BASE64="$(openssl rand -base64 32)"
app:
  catalog-cache:
    # 默认关闭，未配置 Redis 的开发与测试环境继续直接读取数据库。
    enabled: ${BOOT_CATALOG_CACHE_ENABLED:false}
    # 商品详情是可重建的性能副本；主动失效失败时由 TTL 限制陈旧窗口。
    product-detail-ttl: ${BOOT_CATALOG_CACHE_PRODUCT_DETAIL_TTL:PT10M}
  cart:
    redis:
      # 购物车是 Redis 中的权威瞬态数据；关闭时才装配旧数据库适配器。
      enabled: ${BOOT_REDIS_CART_ENABLED:true}
      ttl: ${BOOT_REDIS_CART_TTL:P30D}
      migration-lock-ttl: ${BOOT_REDIS_CART_MIGRATION_LOCK_TTL:PT10S}
      migration-wait-timeout: ${BOOT_REDIS_CART_MIGRATION_WAIT_TIMEOUT:PT2S}
  inventory:
    redis:
      # Redis 负责快速预占，数据库条件更新仍是最终库存事实。
      enabled: ${BOOT_REDIS_INVENTORY_ENABLED:true}
      ttl: ${BOOT_REDIS_INVENTORY_TTL:P7D}
    reconciliation:
      # 数据库可售量是权威值；差异副本通过删除后惰性重建收敛。
      enabled: ${BOOT_INVENTORY_RECONCILIATION_ENABLED:true}
      interval: ${BOOT_INVENTORY_RECONCILIATION_INTERVAL:PT1M}
      batch-size: ${BOOT_INVENTORY_RECONCILIATION_BATCH_SIZE:100}
  order:
    # 单实例学习环境使用 0；多实例部署必须为每个实例配置不同的 worker ID。
    worker-id: ${BOOT_ORDER_WORKER_ID:0}
  order-timeout:
    rocketmq:
      enabled: ${BOOT_ROCKETMQ_ENABLED:true}
      namesrv-addr: ${BOOT_ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876}
      topic: ${BOOT_ROCKETMQ_ORDER_TIMEOUT_TOPIC:bootmall-order-timeout}
      producer-group: ${BOOT_ROCKETMQ_ORDER_TIMEOUT_PRODUCER_GROUP:bootmall-order-timeout-producer}
      consumer-group: ${BOOT_ROCKETMQ_ORDER_TIMEOUT_CONSUMER_GROUP:bootmall-order-timeout-consumer}
      delay-level: ${BOOT_ROCKETMQ_ORDER_TIMEOUT_DELAY_LEVEL:16}
      send-timeout: ${BOOT_ROCKETMQ_SEND_TIMEOUT:PT3S}
      poll-interval: ${BOOT_ROCKETMQ_OUTBOX_POLL_INTERVAL:PT1S}
      batch-size: ${BOOT_ROCKETMQ_OUTBOX_BATCH_SIZE:50}
      max-send-attempts: ${BOOT_ROCKETMQ_OUTBOX_MAX_SEND_ATTEMPTS:5}
      retry-backoff: ${BOOT_ROCKETMQ_OUTBOX_RETRY_BACKOFF:PT5S}
      sending-lease: ${BOOT_ROCKETMQ_OUTBOX_SENDING_LEASE:PT30S}
      max-reconsume-times: ${BOOT_ROCKETMQ_MAX_RECONSUME_TIMES:3}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    # Spring Boot 用 Duration 绑定该值；改配置即可调整新签发令牌的有效期。
    access-token-ttl: PT30M

  # 本地管理员引导（M1-C-05）：默认留空 = 不启用，生产环境不设置即不会创建任何管理员。
  # username 与 password 必须同时注入（只填一项会拒绝启动）；账号不存在时创建并绑定
  # ADMIN 角色，已存在则只补角色关联，重复启动幂等。密码只从环境变量注入，不入仓库。
  local-admin:
    username: ${BOOT_ADMIN_USERNAME:}
    password: ${BOOT_ADMIN_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 学习期：把执行的 SQL 打印到控制台，方便看「MP 到底发了什么 SQL」
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 全局逻辑删除：用户、商品和 SKU 的 Mapper 删除更新 deleted=1，查询自动过滤已删除行
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  health:
    redis:
      # Redis 购物车默认启用，因此健康检查默认验证该真实依赖。
      enabled: ${BOOT_REDIS_HEALTH_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,metrics
